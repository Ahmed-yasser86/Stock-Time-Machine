version: '3.4'
services:
  app_database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Pass123
    ports:
      - "1433:1433"
    restart: always
    volumes:
      - sqlserver_data:/var/opt/mssql       
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Pass123' -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  stocktime.api:
    build:
      context: .
      dockerfile: src/StockTimeMachine.Web/Dockerfile
    container_name: stocktime_api_container
    depends_on:
      app_database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__ContactDb=Server=app-database,1433;Database=ContectManagerDB;User Id=sa;Password=YourStrong@Pass123;Encrypt=False;TrustServerCertificate=True;
      - ConnectionStrings__StocksDbConnection=Server=app-database,1433;Database=StocksDb;User Id=sa;Password=YourStrong@Pass123;Encrypt=False;TrustServerCertificate=True;
      - ConnectionStrings__StockTimeMachineDb=Server=app-database,1433;Database=StockTimeMachineDb;User Id=sa;Password=YourStrong@Pass123;Encrypt=False;TrustServerCertificate=True;

volumes:
  sqlserver_data:                          