# Slim test stack for backend integration runs (SQL Server only).
# The full local stack (Qdrant, FinBERT, API, frontend) lives in the root
# docker-compose.yml. Run from the repo root:
#   docker compose -f deploy/docker-compose.test.yml up -d
services:
  app_database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: app_db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Pass123}
    ports:
      - "1433:1433"
    restart: "no"
    volumes:
      - sqlserver_test_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-YourStrong@Pass123}\" -Q 'SELECT 1' -No || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  stocktime.api:
    build:
      context: ..
      dockerfile: backend/StockTimeMachine.Web/Dockerfile
    container_name: stocktime_api_container
    depends_on:
      app_database:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__StockTimeMachineDb=Server=app_database,1433;Database=StockTimeMachineDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong@Pass123};Encrypt=False;TrustServerCertificate=True;
      - Nlp__Enabled=false
    restart: "no"

volumes:
  sqlserver_test_data:
